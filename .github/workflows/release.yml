name: Publish Android update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTES: ${{ github.event.head_commit.message || '手动发布' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare version metadata
        shell: bash
        run: |
          echo "BUILD_VERSION_CODE=$((300000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=3.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare the existing app signing key
        env:
          ANDROID_UPGRADE_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPGRADE_KEYSTORE_BASE64 }}
          ANDROID_WATCH_KEYSTORE_BASE64: ${{ secrets.ANDROID_WATCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPGRADE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_UPGRADE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maid-manager.keystore"
          test -s "$RUNNER_TEMP/maid-manager.keystore"
          if test -n "$ANDROID_WATCH_KEYSTORE_BASE64"; then
            printf '%s' "$ANDROID_WATCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maid-watch.keystore"
            test -s "$RUNNER_TEMP/maid-watch.keystore"
          fi

      - name: Test and build signed update APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_UPGRADE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_UPGRADE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_UPGRADE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/maid-manager.keystore
          WATCH_STORE_FILE: ${{ runner.temp }}/maid-watch.keystore
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          chmod +x ./gradlew
          WATCH_TASK=:watch:assembleDebug
          if test -s "$WATCH_STORE_FILE"; then WATCH_TASK=:watch:assembleRelease; fi
          ./gradlew :app:testDebugUnitTest :companion-core:testDebugUnitTest :watch:testDebugUnitTest :app:assembleRelease "$WATCH_TASK" --no-daemon \
            -PBUILD_VERSION_CODE="$BUILD_VERSION_CODE" \
            -PBUILD_VERSION_NAME="$BUILD_VERSION_NAME" \
            -PUPDATE_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            -PUPDATE_GITHUB_REPO="${GITHUB_REPOSITORY#*/}"

      - name: Verify signature and prepare update manifest
        id: package
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_UPGRADE_CERT_SHA256 }}
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print)
          test "${#APKS[@]}" -eq 1
          APK_PATH="${APKS[0]}"
          test -f "$APK_PATH"
          APK_NAME="maid-manager-${BUILD_VERSION_NAME}-universal-release.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$APK_NAME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          SIGNATURE_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/$APK_NAME")"
          printf '%s\n' "$SIGNATURE_REPORT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_REPORT" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' | tr -d '[:space:]:')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
          test -n "$ACTUAL_CERT_SHA256"
          test -n "$EXPECTED_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$RUNNER_TEMP/$APK_NAME")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.maidmanager.debug' versionCode='${BUILD_VERSION_CODE}'"
          printf '%s\n' "$BADGING" | grep -F "versionName='${BUILD_VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -F "launchable-activity: name='com.miniichat.MainActivity'"
          WATCH_NAME=""
          if test -s "$RUNNER_TEMP/maid-watch.keystore"; then
            WATCH_NAME="maid-manager-watch-${BUILD_VERSION_NAME}-release.apk"
            cp "watch/build/outputs/apk/release/$WATCH_NAME" "$RUNNER_TEMP/$WATCH_NAME"
            WATCH_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/$WATCH_NAME")"
            printf '%s\n' "$WATCH_REPORT" | grep -F "d1ae2e2d40f963a379b30263498f9092362c40d372825c7db1a5b1c02e2d0164"
            "$AAPT" dump badging "$RUNNER_TEMP/$WATCH_NAME" | grep -F "launchable-activity: name='com.miniichat.watch.WatchActivity'"
          fi
          SHA256="$(sha256sum "$RUNNER_TEMP/$APK_NAME" | cut -d' ' -f1)"
          TAG="v${BUILD_VERSION_NAME}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          jq -n \
            --arg versionName "$BUILD_VERSION_NAME" \
            --argjson versionCode "$BUILD_VERSION_CODE" \
            --arg applicationId "com.maidmanager.debug" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg changelog "$RELEASE_NOTES" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:1,versionCode:$versionCode,versionName:$versionName,applicationId:$applicationId,minSdk:26,apkUrl:$apkUrl,sha256:$sha256,changelog:$changelog,publishedAt:$publishedAt}' \
            > "$RUNNER_TEMP/update-manifest.json"
          jq -e '.schemaVersion == 1 and .applicationId == "com.maidmanager.debug" and (.apkUrl | startswith("https://")) and (.sha256 | test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/update-manifest.json"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "watch_name=$WATCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("$RUNNER_TEMP/${{ steps.package.outputs.apk_name }}" "$RUNNER_TEMP/update-manifest.json")
          if test -n "${{ steps.package.outputs.watch_name }}"; then FILES+=("$RUNNER_TEMP/${{ steps.package.outputs.watch_name }}"); fi
          gh release create "${{ steps.package.outputs.tag }}" \
            "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "女仆管理器 ${BUILD_VERSION_NAME}" \
            --notes "$RELEASE_NOTES"
